[project]
name = "campaign-causal-impact"
version = "0.1.0"
description = "Incrementality measurement for regional campaigns with a synthetic control"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rabia Filiz Gurkanli" }]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"run_demo.py" = ["E402"]
"examples/*" = ["E402"]

